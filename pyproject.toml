[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pta-documents"
version = "0.1.0"
description = "Markdown to and from Word, PowerPoint and PDF in the PTA corporate design."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Wojciech Wosik", email = "wojciech.wosik@pta.de" }]
dependencies = [
    "lxml>=5.2",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pillow>=10.0",
    # Pygments: BSD-2-Clause; code highlighting (E17-S02).
    "pygments>=2.17",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    # segno: BSD-3-Clause, pure Python; QR codes from qr: image references (E11-S04).
    "segno>=1.6",
]

[project.optional-dependencies]
# fontTools: MIT; reads the font files of design.fonts (E01-S03).
# reportlab: BSD; draws the PDF (E05-S01). pikepdf: MPL-2.0, used unmodified as a library; makes
# it PDF/A-2b (E05-S01). pdfplumber: MIT; tests and the PDF converter (E07-S04).
pdf =["fonttools>=4.50", "pikepdf>=9.0", "pdfplumber>=0.11", "reportlab>=4.2"]
svg = ["fonttools>=4.50", "resvg-py>=0.1"]
# cssselect: BSD-3-Clause; the CSS of mermaid-cli's SVG (E06-S03). mermaid-cli itself is
# Node.js (MIT), installed repo-locally by ./run.sh setup from tools/mermaid/package.json.
diagrams = ["cssselect>=1.2"]
# Playwright: Apache-2.0; opens HTML decks in Chromium for the browser tests (E10-S01) and the
# preview (E10-S02). Its browser comes with "python -m playwright install chromium".
preview = ["playwright>=1.40"]
# jsonschema: MIT; only the tests check the schema of the tool make_document with it (E08-S04).
dev = ["jsonschema>=4.18", "lxml-stubs>=0.5", "pyright>=1.1.380", "pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/pta_documents"]

[tool.hatch.build.targets.sdist]
include = ["src/pta_documents", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/design/test_logos.py checks the EMF interpreter of prepare-templates.
pythonpath = ["tools/prepare-templates"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# German texts use typographic dashes and quotes on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
# "src" is implied only without extraPaths; tools/prepare-templates holds the EMF interpreter
# that prepare-templates.py and tests/design/test_logos.py import.
extraPaths = ["src", "tools/prepare-templates"]
include = ["src", "tests", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# python-docx, python-pptx and markdown-it tokens are only partially typed; unknown types
# coming from them are accepted, everything written here is fully annotated.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportPrivateUsage = false
