<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 550.69287109375 450" style="max-width: 550.693px; background-color: white;" role="graphics-document document" aria-roledescription="pie"><style>#my-svg{font-family:Segoe UI,Selawik,sans-serif;font-size:16px;fill:#404040;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#FFFFFF;}#my-svg .error-text{fill:#404040;stroke:#404040;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#787878;stroke:#787878;}#my-svg .marker.cross{stroke:#787878;}#my-svg svg{font-family:Segoe UI,Selawik,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .pieCircle{stroke:#FFFFFF;stroke-width:2px;opacity:1;}#my-svg .pieCircle.highlighted{scale:1.05;opacity:1;}#my-svg .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#my-svg .pieOuterCircle{stroke:#FFFFFF;stroke-width:2px;fill:none;}#my-svg .pieTitleText{text-anchor:middle;font-size:25px;fill:#404040;font-family:Segoe UI,Selawik,sans-serif;}#my-svg .slice{font-family:Segoe UI,Selawik,sans-serif;fill:#FFFFFF;font-size:17px;}#my-svg .legend text{fill:#404040;font-family:Segoe UI,Selawik,sans-serif;font-size:17px;}#my-svg .node .neo-node{stroke:#006FB9;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:#006FB9;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:#006FB9;stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#006FB9;filter:none;}#my-svg [data-look="neo"].node circle{stroke:#006FB9;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:#006FB9;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#006FB9;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg .grid .tick line{stroke:rgb(175, 175, 175);}#my-svg #my-svg-filled-head path{fill:rgb(64, 64, 64);stroke:none;}#my-svg :root{--mermaid-font-family:Segoe UI,Selawik,sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,129.845,131.777L0,0Z" fill="#006FB9" class="pieCircle"/><path d="M129.845,131.777A185,185,0,0,1,-164.295,85.042L0,0Z" fill="#004676" class="pieCircle"/><path d="M-164.295,85.042A185,185,0,0,1,-138.614,-122.52L0,0Z" fill="#9FD8FF" class="pieCircle"/><path d="M-138.614,-122.52A185,185,0,0,1,0,-185L0,0Z" fill="#787878" class="pieCircle"/><text transform="translate(128.38350397450483,-52.623553730514075)" class="slice" style="text-anchor: middle;">38%</text><text transform="translate(-21.772760483867444,137.03105268847693)" class="slice" style="text-anchor: middle;">30%</text><text transform="translate(-137.6999913506458,-17.037455268673952)" class="slice" style="text-anchor: middle;">19%</text><text transform="translate(-57.01665569936746,-126.49372898630108)" class="slice" style="text-anchor: middle;">13%</text></g><text x="0" y="-200" class="pieTitleText">Umsatz nach Region</text><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill: rgb(0, 111, 185); stroke: rgb(0, 111, 185);"/><text x="22" y="14">Nord</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(0, 70, 118); stroke: rgb(0, 70, 118);"/><text x="22" y="14">Süd</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(159, 216, 255); stroke: rgb(159, 216, 255);"/><text x="22" y="14">Ost</text></g><g class="legend" transform="translate(216,22)"><rect width="18" height="18" style="fill: rgb(120, 120, 120); stroke: rgb(120, 120, 120);"/><text x="22" y="14">West</text></g></g></svg>